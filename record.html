<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>記錄 | 差使日誌</title>

    <link rel="stylesheet" href="style.css">

    <script src="records.js" defer></script>
    <script src="record.js" defer></script>
    <script src="bookmark.js" defer></script>

</head>


<body>


<header>

    <a href="index.html" class="logo">
        差使日誌
    </a>

    <nav>

        <a href="records.html">
            기록
        </a>

        <a href="resources.html">
            자료실
        </a>

        <a href="about.html">
            소개
        </a>

        <a href="search.html">
            검색
        </a>

        <a href="bookmarks.html">
            보관 기록
        </a>

    </nav>

</header>



<main>

    <section class="record-detail">

        <div class="record-detail-mark">
            HAROHA RECORD
        </div>


        <p class="record-detail-number"
           id="recordNumber">
        </p>


        <h1 id="recordTitle">
        </h1>


        <div class="record-detail-line"></div>


        <p class="record-detail-date"
           id="recordDateKorean">
        </p>



        <article class="record-document">


            <div class="document-heading">

                <span id="recordCategory">
                </span>

                <span id="recordDate">
                </span>

            </div>


            <div id="recordContent">
            </div>


        </article>



        <section class="record-information">


            <div>

                <span>
                    記錄番號
                </span>

                <strong id="recordInfoNumber">
                </strong>

            </div>


            <div>

                <span>
                    年月日
                </span>

                <strong id="recordInfoDate">
                </strong>

            </div>


            <div>

                <span>
                    分類
                </span>

                <strong id="recordInfoCategory">
                </strong>

            </div>


        </section>



        <div class="record-navigation">

            <a id="previousRecord">
                ← 이전 기록
            </a>


            <a href="records.html">
                기록 목록
            </a>


            <a id="nextRecord">
                다음 기록 →
            </a>

        </div>


    </section>

</main>



<footer>

    <div>
        差使日誌
    </div>

    <p>
        A personal archive for HAROHA
    </p>

    <small>
        2026
    </small>

</footer>


</body>

</html>
